    <style>
        .devolucion-card {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            padding: 20px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }
        .devolucion-card:hover {
            transform: translateY(-5px);
        }
        .devolucion-card.pendiente {
            border-left: 5px solid #ffc107;
        }
        .devolucion-card.vencida {
            border-left: 5px solid #dc3545;
        }
        .devolucion-icon {
            font-size: 2rem;
            margin-right: 15px;
        }
        .devolucion-title {
            font-weight: 600;
            margin-bottom: 5px;
        }
        .devolucion-date {
            color: #6c757d;
            font-size: 0.9rem;
        }
        .devolucion-actions {
            display: flex;
            gap: 10px;
        }
        .action-btn {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .filter-section {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            padding: 20px;
            margin-bottom: 20px;
        }
        .form-input {
            border-radius: 25px;
            padding: 10px 20px;
            border: 1px solid #e0e0e0;
            transition: all 0.3s ease;
        }
        .form-input:focus {
            border-color: #2C3E50;
            box-shadow: 0 0 0 0.2rem rgba(44, 62, 80, 0.25);
        }
        .btn-custom {
            border-radius: 25px;
            padding: 10px 30px;
            font-weight: 500;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }
        .btn-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .product-list {
            margin-top: 10px;
            padding-left: 20px;
        }
        .product-list li {
            margin-bottom: 5px;
        }
        .dias-pendientes {
            font-weight: 600;
            color: #dc3545;
        }
        .dias-pendientes.pendiente {
            color: #ffc107;
        }
    </style>
</head>
<body>
    <!-- Main container -->
    <main class="full-box main-container">
        <!-- Page content -->
        <section class="full-box page-content">
            <!-- Page header -->
            <div class="full-box page-header">
                <h3 class="text-left">
                    <i class="fas fa-file-invoice fa-fw"></i> &nbsp; DEVOLUCIONES SIN FACTURA
                </h3>
                <p class="text-justify">
                    En esta sección puedes gestionar las devoluciones que aún no tienen factura asociada. Realiza seguimiento y gestiona las devoluciones pendientes de facturación.
                </p>
            </div>

            <!-- Navigation tabs -->
            <div class="container-fluid">
                <ul class="full-box list-unstyled page-nav-tabs">
                    <li>
                        <a href="devolucion-crear.html"><i class="fas fa-plus fa-fw"></i> &nbsp; NUEVA DEVOLUCIÓN</a>
                    </li>
                    <li>
                        <a href="devolucion-consultar.html"><i class="fas fa-search fa-fw"></i> &nbsp; CONSULTAR DEVOLUCIONES</a>
                    </li>
                    <li>
                        <a class="active" href="devolucion-sin-factura.html"><i class="fas fa-file-invoice fa-fw"></i> &nbsp; DEVOLUCIONES SIN FACTURA</a>
                    </li>
                </ul>
            </div>

            <!-- Content -->
            <div class="container-fluid">
                <!-- Filtros -->
                <div class="filter-section">
                    <form class="form-neon" id="filterForm">
                        <div class="row">
                            <div class="col-12 col-md-3">
                                <div class="form-group">
                                    <label for="estadoFactura">
                                        <i class="fas fa-filter"></i> Estado
                                    </label>
                                    <select class="form-control form-input" id="estadoFactura" name="estadoFactura">
                                        <option value="">Todos los estados</option>
                                        <option value="pendiente">Pendiente</option>
                                        <option value="vencida">Vencida</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-12 col-md-3">
                                <div class="form-group">
                                    <label for="fechaInicio">
                                        <i class="fas fa-calendar"></i> Fecha Inicio
                                    </label>
                                    <input type="date" class="form-control form-input" id="fechaInicio" name="fechaInicio">
                                </div>
                            </div>
                            <div class="col-12 col-md-3">
                                <div class="form-group">
                                    <label for="fechaFin">
                                        <i class="fas fa-calendar"></i> Fecha Fin
                                    </label>
                                    <input type="date" class="form-control form-input" id="fechaFin" name="fechaFin">
                                </div>
                            </div>
                            <div class="col-12 col-md-3">
                                <div class="form-group">
                                    <label for="cliente">
                                        <i class="fas fa-user"></i> Cliente
                                    </label>
                                    <select class="form-control form-input" id="cliente" name="cliente">
                                        <option value="">Todos los clientes</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="text-center mt-3">
                            <button type="submit" class="btn btn-info btn-custom">
                                <i class="fas fa-search"></i> &nbsp; FILTRAR
                            </button>
                            <button type="reset" class="btn btn-secondary btn-custom ml-2">
                                <i class="fas fa-eraser"></i> &nbsp; LIMPIAR
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Lista de Devoluciones -->
                <div id="devolucionesContainer"></div>

                <div class="devolucion-card pendiente">

                            <p class="dias-pendientes pendiente">

                            </p>
                            <ul class="product-list">
                            </ul>
                        </div>
                        <div class="col-3 text-right devolucion-actions">
                            <button class="btn btn-info action-btn" title="Ver Detalles">
                                <i class="fas fa-eye"></i>
                            </button>
                            <button class="btn btn-success action-btn" title="Generar Factura">

                    </div>

                -->

                <div class="devolucion-card vencida">
                    <div class="row align-items-center">

                        </div>
                        <div class="col-8">
                            <small class="devolucion-date">

                        <div class="col-3 text-right devolucion-actions">

                            <button class="btn btn-success action-btn" title="Generar Factura">

                                <i class="fas fa-exclamation"></i>
                            </button>
                        </div>
                    </div>
                </div>
                -->
            </div>
        </section>
    </main>

    <!-- Scripts necesarios -->
    <script src="./js/jquery-3.4.1.min.js"></script>
    <script src="./js/popper.min.js"></script>
    <script src="./js/bootstrap.min.js"></script>
    <script src="./js/jquery.mCustomScrollbar.concat.min.js"></script>
    <script src="./js/bootstrap-material-design.min.js"></script>
    <script src="./js/sweetalert2.min.js"></script>
    <script>
        if (false) {
        $(document).ready(function() {
            $('body').bootstrapMaterialDesign();

            // Manejo del formulario de filtros
            $('#filterForm').on('submit', function(e) {
                e.preventDefault();
                Swal.fire({
                    icon: 'info',
                    title: 'Filtrando...',
                    text: 'Se están aplicando los filtros seleccionados',
                    showConfirmButton: false,
                    timer: 1000
                });
            });

            // Confirmación para limpiar filtros
            $('button[type="reset"]').click(function(e) {
                e.preventDefault();
                Swal.fire({
                    title: '¿Limpiar filtros?',
                    text: "Se mostrarán todas las devoluciones",
                    icon: 'question',
                    showCancelButton: true,
                    confirmButtonColor: '#3085d6',
                    cancelButtonColor: '#d33',
                    confirmButtonText: 'Sí, limpiar',
                    cancelButtonText: 'Cancelar'
                }).then((result) => {
                    if (result.isConfirmed) {
                        $('#filterForm')[0].reset();
                    }
                });
            });

            // Ver detalles
            $('.btn-info.action-btn').click(function() {
                Swal.fire({
                    title: 'Detalles de la Devolución',
                    html: `
                        <div class="text-left">
                            <p><strong>Fecha:</strong> 2024-04-15</p>
                            <p><strong>Estado:</strong> Pendiente de Factura</p>
                            <p><strong>Días Pendiente:</strong> 5 días</p>
                            <p><strong>Productos:</strong></p>
                            <ul>
                            </ul>
                            <p><strong>Observaciones:</strong> Productos recibidos en mal estado</p>
                        </div>
                    `,
                    confirmButtonColor: '#2C3E50'
                });
            });

            // Generar factura
            $('.btn-success.action-btn').click(function() {
                Swal.fire({
                    title: '¿Generar factura?',
                    text: "Se generará una factura para esta devolución",
                    icon: 'question',
                    showCancelButton: true,
                    confirmButtonColor: '#3085d6',
                    cancelButtonColor: '#d33',
                    confirmButtonText: 'Sí, generar',
                    cancelButtonText: 'Cancelar'
                }).then((result) => {
                    if (result.isConfirmed) {
                        Swal.fire(
                            '¡Factura Generada!',
                            'La factura ha sido generada correctamente.',
                            'success'
                        );
                    }
                });
            });

            // Enviar recordatorio
            $('.btn-warning.action-btn').click(function() {
                Swal.fire({
                    title: '¿Enviar recordatorio?',
                    text: "Se enviará un recordatorio al cliente",
                    icon: 'question',
                    showCancelButton: true,
                    confirmButtonColor: '#3085d6',
                    cancelButtonColor: '#d33',
                    confirmButtonText: 'Sí, enviar',
                    cancelButtonText: 'Cancelar'
                }).then((result) => {
                    if (result.isConfirmed) {
                        Swal.fire(
                            '¡Recordatorio Enviado!',
                            'El recordatorio ha sido enviado correctamente.',
                            'success'
                        );
                    }
                });
            });

            // Marcar como urgente
            $('.btn-danger.action-btn').click(function() {
                Swal.fire({
                    title: '¿Marcar como urgente?',
                    text: "Esta devolución será marcada como prioritaria",
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#3085d6',
                    cancelButtonColor: '#d33',
                    confirmButtonText: 'Sí, marcar',
                    cancelButtonText: 'Cancelar'
                }).then((result) => {
                    if (result.isConfirmed) {
                        Swal.fire(
                            '¡Marcada como Urgente!',
                            'La devolución ha sido marcada como prioritaria.',
                            'success'
                        );
                    }
                });
            });
        });
        }
    </script>
    <script src="./js/devoluciones/devoluciones-api.js"></script>
    <script src="./js/devoluciones/devoluciones-consulta.js"></script>
    <script src="./js/components.js"></script>
    <script src="./js/main.js"></script>

    <!-- Script para manejar la precarga -->
    <script>
        window.addEventListener('load', function() {
            document.body.classList.add('loaded');
        });
    </script>
</body>
</html>
