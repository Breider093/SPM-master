<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <title>Clientes con Equipo Pendiente</title>

    <!-- Normalize V8.0.1 -->
    <link rel="stylesheet" href="./css/normalize.css">

    <!-- Bootstrap V4.3 -->
    <link rel="stylesheet" href="./css/bootstrap.min.css">

    <!-- Bootstrap Material Design V4.0 -->
    <link rel="stylesheet" href="./css/bootstrap-material-design.min.css">

    <!-- Font Awesome V5.9.0 -->
    <link rel="stylesheet" href="./css/all.css">

    <!-- Sweet Alerts V8.13.0 CSS file -->
    <link rel="stylesheet" href="./css/sweetalert2.min.css">

    <!-- jQuery Custom Content Scroller V3.1.5 -->
    <link rel="stylesheet" href="./css/jquery.mCustomScrollbar.css">
    
    <!-- General Styles -->
    <link rel="stylesheet" href="./css/style.css">

    <!-- Preload Styles -->
    <link rel="stylesheet" href="./css/preload.css">

    <style>
        .table-container {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            padding: 20px;
            margin-bottom: 20px;
        }
        .search-section {
            margin-bottom: 20px;
        }
        .search-input {
            border-radius: 5px;
            border: 1px solid #ddd;
            padding: 8px 15px;
        }
        .table thead th {
            background-color: #f8f9fa;
            border-bottom: 2px solid #dee2e6;
            color: #333;
            font-weight: 600;
        }
        .table td {
            vertical-align: middle;
        }
        .btn-action {
            padding: 5px 10px;
            margin: 0 2px;
            border-radius: 4px;
            background-color: #6c757d;
            color: white;
            border: none;
        }
        .btn-action i {
            margin-right: 5px;
        }
        .nit-cell {
            color: #007bff;
            font-weight: 500;
        }
        .table-hover tbody tr:hover {
            background-color: rgba(0,123,255,0.05);
        }
        .btn-ver-detalle {
            background-color: #6c757d;
            color: white;
            border: none;
            padding: 5px 15px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    
    <!-- Main container -->
    <main class="full-box main-container">
        <!-- El menú lateral se cargará dinámicamente desde components.js -->

        <!-- Page content -->
        <section class="full-box page-content">
            <!-- La barra de navegación se cargará dinámicamente desde components.js -->

            <!-- Page header -->
            <div class="full-box page-header">
                <h3 class="text-left">
                    <i class="fas fa-tools fa-fw"></i> &nbsp; CLIENTES CON EQUIPO PENDIENTE
                </h3>
                <p class="text-justify">
                    Lista de clientes que tienen equipos pendientes por devolver o en proceso de mantenimiento.
                </p>
            </div>

            <div class="container-fluid">
                <ul class="full-box list-unstyled page-nav-tabs">
                    <li>
                        <a href="client-new.html"><i class="fas fa-plus fa-fw"></i> &nbsp; AGREGAR CLIENTE</a>
                    </li>
                    <li>
                        <a href="client-list.html"><i class="fas fa-clipboard-list fa-fw"></i> &nbsp; LISTA DE CLIENTES</a>
                    </li>
                    <li>
                        <a href="client-search.html"><i class="fas fa-search fa-fw"></i> &nbsp; BUSCAR CLIENTE</a>
                    </li>
                    <li>
                        <a class="active" href="cliente-saldo.html"><i class="fas fa-dollar-sign fa-fw"></i> &nbsp; CONSULTAR SALDO</a>
                    </li>
                    <li>
                        <a href="cliente-kardex.html"><i class="fas fa-file-invoice-dollar fa-fw"></i> &nbsp; KARDEX</a>
                    </li>
                </ul>	
            </div>

            <!-- Content -->
            <div class="container-fluid">
                <div class="row mb-4">
                    <div class="col-12 col-md-4">
                        <div class="form-group">
                            <label>Cliente</label>
                            <input type="text" class="form-control search-input" id="searchCliente" placeholder="Buscar cliente...">
                        </div>
                    </div>
                </div>

                <div class="table-container">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>NIT</th>
                                    <th>CLIENTE</th>
                                    <th>OBRA</th>
                                    <th>TELÉFONO</th>
                                    <th>CONTACTO</th>
                                    <th>ACCIONES</th>
                                </tr>
                            </thead>
                            <tbody id="clientesTableBody">
                                <!-- Los datos se cargarán dinámicamente -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
    </main>
    
    <!--=============================================
    =            Include JavaScript files           =
    ==============================================-->
    <!-- jQuery V3.4.1 -->
    <script src="./js/jquery-3.4.1.min.js"></script>

    <!-- popper -->
    <script src="./js/popper.min.js"></script>

    <!-- Bootstrap V4.3 -->
    <script src="./js/bootstrap.min.js"></script>

    <!-- jQuery Custom Content Scroller V3.1.5 -->
    <script src="./js/jquery.mCustomScrollbar.concat.min.js"></script>

    <!-- Bootstrap Material Design V4.0 -->
    <script src="./js/bootstrap-material-design.min.js"></script>
    <script>$(document).ready(function() { $('body').bootstrapMaterialDesign(); });</script>

    <!-- Componentes -->
    <script src="./js/components.js"></script>

    <script src="./js/main.js"></script>

    <!-- Script para manejar la precarga -->
    <script>
        window.addEventListener('load', function() {
            document.body.classList.add('loaded');
        });
    </script>

    <script>
        $(document).ready(function() {
            // Datos de ejemplo - En producción, estos vendrían de una API
            const clientesEjemplo = [
                {
                    nit: '802020796-9',
                    cliente: 'A&B GERENCIA INTEGRAL SAS',
                    obra: 'CALLE 45B #20-136',
                    telefono: '3043450209',
                    contacto: '3043'
                },
                {
                    nit: '72252275',
                    cliente: 'ADRIAN MARCHENA',
                    obra: 'CALLE 35 # 5 A 15',
                    telefono: '3006414049',
                    contacto: 'ADRIAN'
                },
                {
                    nit: '1111117',
                    cliente: 'AICL CONSTRUCCIONES',
                    obra: 'CRA 6G #101-24 VILLA SAN PEDRO',
                    telefono: 'X',
                    contacto: 'X'
                },
                {
                    nit: '2222222222222',
                    cliente: 'ALEX RIOS',
                    obra: 'CIUDADELA METROPOLITANA',
                    telefono: 'X',
                    contacto: 'PRIMO'
                },
                {
                    nit: '22639',
                    cliente: 'ALEXIS GUZMAN',
                    obra: 'CALLE 45 # 8B 30',
                    telefono: 'X',
                    contacto: 'alexis'
                },
                {
                    nit: '901061987',
                    cliente: 'ALQUILERES LYN',
                    obra: 'CRA 8C #44-65',
                    telefono: '3104121478',
                    contacto: 'X'
                },
                {
                    nit: '8.709.694',
                    cliente: 'ANGEL GAMERO',
                    obra: 'CALLE 77 CON VIA 40',
                    telefono: '3105330749',
                    contacto: 'X'
                }
            ];

            function renderClientes(clientes) {
                const tbody = $('#clientesTableBody');
                tbody.empty();

                clientes.forEach(cliente => {
                    const row = `
                        <tr>
                            <td class="nit-cell">${cliente.nit}</td>
                            <td>${cliente.cliente}</td>
                            <td>${cliente.obra}</td>
                            <td>${cliente.telefono}</td>
                            <td>${cliente.contacto}</td>
                            <td>
                                <button class="btn btn-ver-detalle">
                                    Ver Detalle
                                </button>
                                <button class="btn btn-action">
                                    <i class="fas fa-ellipsis-v"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                    tbody.append(row);
                });
            }

            // Filtrado de clientes
            $('#searchCliente').on('keyup', function() {
                const searchTerm = $(this).val().toLowerCase();
                const filteredClientes = clientesEjemplo.filter(cliente => 
                    cliente.cliente.toLowerCase().includes(searchTerm) ||
                    cliente.nit.toLowerCase().includes(searchTerm)
                );
                renderClientes(filteredClientes);
            });

            // Inicializar la tabla con los datos de ejemplo
            renderClientes(clientesEjemplo);

            // Manejadores para los botones de acción
            $(document).on('click', '.btn-ver-detalle', function() {
                const row = $(this).closest('tr');
                const cliente = row.find('td:eq(1)').text();
                Swal.fire({
                    title: 'Detalles del Cliente',
                    text: `Mostrando detalles de ${cliente}`,
                    icon: 'info'
                });
            });
        });
    </script>
</body>
</html>
