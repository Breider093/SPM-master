<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Reposición</title>

    <!-- Normalize V8.0.1 -->
    <link rel="stylesheet" href="./css/normalize.css">

    <!-- Bootstrap V4.3 -->
    <link rel="stylesheet" href="./css/bootstrap.min.css">

    <!-- Bootstrap Material Design V4.0 -->
    <link rel="stylesheet" href="./css/bootstrap-material-design.min.css">

    <!-- Font Awesome V5.9.0 -->
    <link rel="stylesheet" href="./css/all.css">

    <!-- Sweet Alerts V8.13.0 CSS file -->
    <link rel="stylesheet" href="./css/sweetalert2.min.css">

    <!-- jQuery Custom Content Scroller V3.1.5 -->
    <link rel="stylesheet" href="./css/jquery.mCustomScrollbar.css">
    
    <!-- General Styles -->
    <link rel="stylesheet" href="./css/style.css">

    <!-- Preload Styles -->
    <link rel="stylesheet" href="./css/preload.css">

    <style>
        .form-card {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            padding: 20px;
            margin-bottom: 20px;
        }
        .form-section {
            margin-bottom: 30px;
        }
        .section-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: #2C3E50;
            border-bottom: 2px solid #2C3E50;
            padding-bottom: 10px;
        }
        .form-input {
            border-radius: 25px;
            padding: 10px 20px;
            border: 1px solid #e0e0e0;
            transition: all 0.3s ease;
        }
        .form-input:focus {
            border-color: #2C3E50;
            box-shadow: 0 0 0 0.2rem rgba(44, 62, 80, 0.25);
        }
        .btn-custom {
            border-radius: 25px;
            padding: 10px 30px;
            font-weight: 500;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }
        .btn-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .product-item {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            transition: all 0.3s ease;
        }
        .product-item:hover {
            background: #e9ecef;
        }
        .total-section {
            background: #2C3E50;
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }
        .reason-section {
            margin-top: 15px;
        }
        .reason-option {
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 10px;
        }
        .reason-option:hover {
            border-color: #2C3E50;
            background: #f8f9fa;
        }
        .reason-option.selected {
            border-color: #2C3E50;
            background: #f8f9fa;
        }
    </style>
</head>
<body>
    <!-- Main container -->
    <main class="full-box main-container">
        <!-- Page content -->
        <section class="full-box page-content">
            <!-- Page header -->
            <div class="full-box page-header">
                <h3 class="text-left">
                    <i class="fas fa-exchange-alt fa-fw"></i> &nbsp; NUEVA REPOSICIÓN
                </h3>
                <p class="text-justify">
                    En esta sección puedes crear nuevas reposiciones de productos. Selecciona los productos a reponer y especifica la razón de la reposición.
                </p>
            </div>

            <!-- Navigation tabs -->
            <div class="container-fluid">
                <ul class="full-box list-unstyled page-nav-tabs text-primary">
                    <li>
                        <a class="active bg-primary text-white" href="reposition-new.html"><i class="fas fa-plus fa-fw"></i> &nbsp; NUEVA REPOSICIÓN</a>
                    </li>
                    <li>
                        <a href="reposition-list.html" class="text-primary hover-primary"><i class="fas fa-list fa-fw"></i> &nbsp; LISTA DE REPOSICIONES</a>
                    </li>
                </ul>
            </div>

            <!-- Content -->
            <div class="container-fluid">
                <form class="form-neon shadow-sm" id="repositionForm">
                    <!-- Formulario de Reposición -->
                    <div class="form-card bg-white rounded">
                        <h4 class="section-title text-primary border-bottom pb-2">
                            <i class="fas fa-file-alt text-primary"></i> &nbsp; Formulario de Reposición
                        </h4>
                        <div class="row">
                            <!-- Fecha -->
                            <div class="col-12 col-md-6">
                                <div class="form-group bmd-form-group">
                                    <label for="fecha" class="bmd-label-floating text-primary">Fecha *</label>
                                    <input type="date" class="form-control border-primary" id="fecha" name="fecha" required>
                                </div>
                            </div>
                        </div>

                        <!-- Datos del cliente -->
                        <div class="row mt-4">
                            <div class="col-12">
                                <h5 class="mb-3">Datos del cliente</h5>
                            </div>
                            <div class="col-12 col-md-6">
                                <div class="form-group bmd-form-group">
                                    <label for="cliente" class="bmd-label-floating">Cliente</label>
                                    <input type="text" class="form-control" id="cliente" name="cliente" required>
                                </div>
                            </div>
                            <div class="col-12 col-md-6">
                                <div class="form-group bmd-form-group">
                                    <label for="nit" class="bmd-label-floating">Nit</label>
                                    <input type="text" class="form-control" id="nit" name="nit" required>
                                </div>
                            </div>
                            <div class="col-12 col-md-6">
                                <div class="form-group bmd-form-group">
                                    <label for="direccion" class="bmd-label-floating">Dirección</label>
                                    <input type="text" class="form-control" id="direccion" name="direccion" required>
                                </div>
                            </div>
                        </div>

                        <!-- Datos de la Obra -->
                        <div class="row mt-4">
                            <div class="col-12">
                                <h5 class="mb-3">Datos de la Obra</h5>
                            </div>
                            <div class="col-12 col-md-6">
                                <div class="form-group bmd-form-group">
                                    <label for="obra" class="bmd-label-floating">Obra</label>
                                    <select class="form-control" id="obra" name="obra" required>
                                        <option value="">SELECCIONAR *</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-12 col-md-6">
                                <div class="form-group bmd-form-group">
                                    <label for="direccion_obra" class="bmd-label-floating">Dirección</label>
                                    <input type="text" class="form-control" id="direccion_obra" name="direccion_obra" readonly>
                                </div>
                            </div>
                            <div class="col-12 col-md-6">
                                <div class="form-group bmd-form-group">
                                    <label for="telefono" class="bmd-label-floating">Teléfono</label>
                                    <input type="tel" class="form-control" id="telefono" name="telefono" readonly>
                                </div>
                            </div>
                        </div>

                        <!-- Observaciones -->
                        <div class="row mt-4">
                            <div class="col-12">
                                <div class="form-group bmd-form-group">
                                    <label for="observaciones" class="bmd-label-floating">Observaciones</label>
                                    <textarea class="form-control" id="observaciones" name="observaciones" rows="3"></textarea>
                                </div>
                            </div>
                    <!-- Observaciones -->
                    <div class="form-card">
                        <h4 class="section-title">
                            <i class="fas fa-comment"></i> &nbsp; Observaciones
                        </h4>
                        <div class="form-group">
                            <textarea class="form-control form-input" id="observaciones" name="observaciones" rows="4" placeholder="Ingrese observaciones adicionales sobre la reposición"></textarea>
                        </div>
                    </div>

                    <!-- Botones de Acción -->
                    <div class="text-center mt-4">
                        <button type="submit" class="btn btn-raised btn-primary btn-sm shadow-sm">
                            <i class="fas fa-save"></i> &nbsp; GUARDAR REPOSICIÓN
                        </button>
                        &nbsp; &nbsp;
                        <button type="button" class="btn btn-raised btn-outline-secondary btn-sm shadow-sm" id="btnLimpiar">
                            <i class="fas fa-paint-roller"></i> &nbsp; LIMPIAR FORMULARIO
                        </button>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <!-- Scripts necesarios -->
    <script src="./js/jquery-3.4.1.min.js"></script>
    <script src="./js/popper.min.js"></script>
    <script src="./js/bootstrap.min.js"></script>
    <script src="./js/jquery.mCustomScrollbar.concat.min.js"></script>
    <script src="./js/bootstrap-material-design.min.js"></script>
    <script src="./js/sweetalert2.min.js"></script>
    <script>
        $(document).ready(function() {
            $('body').bootstrapMaterialDesign();

            // Función para agregar producto
            window.addProduct = function() {
                const container = document.getElementById('productosContainer');
                const newProduct = document.createElement('div');
                newProduct.className = 'product-item';
                newProduct.innerHTML = `
                    <div class="row">
                        <div class="col-12 col-md-4">
                            <div class="form-group">
                                <label>Producto</label>
                                <select class="form-control form-input producto-select" required>
                                    <option value="">Seleccione producto</option>
                                    <option value="1">Cemento</option>
                                    <option value="2">Arena</option>
                                    <option value="3">Grava</option>
                                    <option value="4">Varilla</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-12 col-md-3">
                            <div class="form-group">
                                <label>Cantidad</label>
                                <input type="number" class="form-control form-input cantidad-input" placeholder="Cantidad" required>
                            </div>
                        </div>
                        <div class="col-12 col-md-3">
                            <div class="form-group">
                                <label>Razón</label>
                                <select class="form-control form-input razon-select" required>
                                    <option value="">Seleccione razón</option>
                                    <option value="1">Producto defectuoso</option>
                                    <option value="2">Producto dañado</option>
                                    <option value="3">Producto incorrecto</option>
                                    <option value="4">Otro</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-12 col-md-2">
                            <div class="form-group">
                                <label>&nbsp;</label>
                                <button type="button" class="btn btn-danger btn-block" onclick="removeProduct(this)">
                                    <i class="fas fa-times"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(newProduct);
            };

            // Función para eliminar producto
            window.removeProduct = function(button) {
                button.closest('.product-item').remove();
            };

            // Manejo del formulario
            $('#repositionForm').on('submit', function(e) {
                e.preventDefault();
                
                // Validación de campos requeridos
                const cliente = $('#cliente').val();
                const fecha = $('#fecha').val();
                const productos = [];
                
                $('.producto-select').each(function(index) {
                    const producto = $(this).val();
                    const cantidad = $('.cantidad-input').eq(index).val();
                    const razon = $('.razon-select').eq(index).val();
                    
                    if (producto && cantidad && razon) {
                        productos.push({
                            producto: producto,
                            cantidad: cantidad,
                            razon: razon
                        });
                    }
                });

                if (!cliente || !fecha || productos.length === 0) {
                    Swal.fire({
                        icon: 'error',
                        title: 'Error',
                        text: 'Por favor complete todos los campos requeridos'
                    });
                    return;
                }

                // Confirmación antes de guardar
                Swal.fire({
                    title: '¿Guardar reposición?',
                    text: "¿Está seguro de guardar esta reposición?",
                    icon: 'question',
                    showCancelButton: true,
                    confirmButtonColor: '#3085d6',
                    cancelButtonColor: '#d33',
                    confirmButtonText: 'Sí, guardar',
                    cancelButtonText: 'Cancelar'
                }).then((result) => {
                    if (result.isConfirmed) {
                        Swal.fire(
                            '¡Guardado!',
                            'La reposición ha sido registrada correctamente.',
                            'success'
                        );
                    }
                });
            });

            // Confirmación para limpiar formulario
            $('button[type="reset"]').click(function(e) {
                e.preventDefault();
                Swal.fire({
                    title: '¿Limpiar formulario?',
                    text: "Se perderán todos los datos ingresados",
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#3085d6',
                    cancelButtonColor: '#d33',
                    confirmButtonText: 'Sí, limpiar',
                    cancelButtonText: 'Cancelar'
                }).then((result) => {
                    if (result.isConfirmed) {
                        $('#repositionForm')[0].reset();
                        $('#productosContainer').html(`
                            <div class="product-item">
                                <div class="row">
                                    <div class="col-12 col-md-4">
                                        <div class="form-group">
                                            <label>Producto</label>
                                            <select class="form-control form-input producto-select" required>
                                                <option value="">Seleccione producto</option>
                                                <option value="1">Cemento</option>
                                                <option value="2">Arena</option>
                                                <option value="3">Grava</option>
                                                <option value="4">Varilla</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="col-12 col-md-3">
                                        <div class="form-group">
                                            <label>Cantidad</label>
                                            <input type="number" class="form-control form-input cantidad-input" placeholder="Cantidad" required>
                                        </div>
                                    </div>
                                    <div class="col-12 col-md-3">
                                        <div class="form-group">
                                            <label>Razón</label>
                                            <select class="form-control form-input razon-select" required>
                                                <option value="">Seleccione razón</option>
                                                <option value="1">Producto defectuoso</option>
                                                <option value="2">Producto dañado</option>
                                                <option value="3">Producto incorrecto</option>
                                                <option value="4">Otro</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="col-12 col-md-2">
                                        <div class="form-group">
                                            <label>&nbsp;</label>
                                            <button type="button" class="btn btn-danger btn-block" onclick="removeProduct(this)">
                                                <i class="fas fa-times"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `);
                    }
                });
            });
        });
    </script>
    <script src="./js/components.js"></script>
    <script src="./js/main.js"></script>

    <!-- Script para manejar la precarga y funcionalidad -->
    <script>
        window.addEventListener('load', function() {
            document.body.classList.add('loaded');
        });

        $(document).ready(function() {
            // Manejar cambios en el select de obra
            $('#obra').change(function() {
                const obraId = $(this).val();
                if (obraId) {
                    // Aquí simularemos obtener los datos de la obra
                    // En un caso real, esto vendría de una base de datos
                    const obraData = {
                        direccion: 'Calle Principal #123',
                        telefono: '555-0123'
                    };
                    $('#direccion_obra').val(obraData.direccion);
                    $('#telefono').val(obraData.telefono);
                } else {
                    $('#direccion_obra').val('');
                    $('#telefono').val('');
                }
            });

            // Calcular total cuando cambian las cantidades
            $(document).on('input', '.cantidad-reponer', function() {
                let total = 0;
                $('.cantidad-reponer').each(function() {
                    const cantidad = parseFloat($(this).val()) || 0;
                    const precio = parseFloat($(this).closest('tr').find('.precio').text().replace('$', '')) || 0;
                    const subtotal = cantidad * precio;
                    $(this).closest('tr').find('.total').text('$' + subtotal.toFixed(2));
                    total += subtotal;
                });
                $('#total').text('$' + total.toFixed(2));
            });

            // Eliminar producto
            $(document).on('click', '.btn-eliminar', function() {
                $(this).closest('tr').remove();
                // Recalcular total
                let total = 0;
                $('.cantidad-reponer').each(function() {
                    const cantidad = parseFloat($(this).val()) || 0;
                    const precio = parseFloat($(this).closest('tr').find('.precio').text().replace('$', '')) || 0;
                    total += cantidad * precio;
                });
                $('#total').text('$' + total.toFixed(2));
            });

            // Manejar envío del formulario
            $('#repositionForm').submit(function(e) {
                e.preventDefault();
                
                // Validar campos requeridos
                if (!$('#fecha').val() || !$('#cliente').val() || !$('#obra').val()) {
                    Swal.fire({
                        icon: 'error',
                        title: 'Error',
                        text: 'Por favor complete todos los campos requeridos'
                    });
                    return;
                }

                // Confirmar antes de guardar
                Swal.fire({
                    title: '¿Crear reposición?',
                    text: '¿Está seguro de crear esta reposición?',
                    icon: 'question',
                    showCancelButton: true,
                    confirmButtonColor: '#3085d6',
                    cancelButtonColor: '#d33',
                    confirmButtonText: 'Sí, crear',
                    cancelButtonText: 'No, cancelar'
                }).then((result) => {
                    if (result.isConfirmed) {
                        // Aquí iría el código para guardar la reposición
                        Swal.fire(
                            '¡Creada!',
                            'La reposición ha sido creada correctamente.',
                            'success'
                        );
                    }
                });
            });

            // Manejar botón cancelar
            $('#btnLimpiar').click(function() {
                Swal.fire({
                    title: '¿Cancelar reposición?',
                    text: 'Se perderán todos los datos ingresados',
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#3085d6',
                    cancelButtonColor: '#d33',
                    confirmButtonText: 'Sí, cancelar',
                    cancelButtonText: 'No, continuar'
                }).then((result) => {
                    if (result.isConfirmed) {
                        $('#repositionForm')[0].reset();
                        $('.cantidad-reponer').val('');
                        $('.total').text('$0.00');
                        $('#total').text('$0.00');
                    }
                });
            });
        });
    </script>
</body>
</html>
