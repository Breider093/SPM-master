<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <title>Vincular Producto</title>

    <!-- Normalize V8.0.1 -->
    <link rel="stylesheet" href="./css/normalize.css">

    <!-- Bootstrap V4.3 -->
    <link rel="stylesheet" href="./css/bootstrap.min.css">

    <!-- Bootstrap Material Design V4.0 -->
    <link rel="stylesheet" href="./css/bootstrap-material-design.min.css">

    <!-- Font Awesome V5.9.0 -->
    <link rel="stylesheet" href="./css/all.css">

    <!-- jQuery Custom Content Scroller V3.1.5 -->
    <link rel="stylesheet" href="./css/jquery.mCustomScrollbar.css">

    <!-- General Styles -->
    <link rel="stylesheet" href="./css/style.css">

    <!-- Preload Styles -->
    <link rel="stylesheet" href="./css/preload.css">
</head>
<body>
    <!-- Main container -->
    <main class="full-box main-container">
        <!-- Page content -->
        <section class="full-box page-content">
            <!-- Page header -->
            <div class="full-box page-header">
                <h3 class="text-left">
                    <i class="fas fa-link fa-fw"></i> &nbsp; VINCULAR PRODUCTO
                </h3>
                <p class="text-justify">
                    En esta sección puedes vincular productos a categorías o proveedores. Completa los campos requeridos para realizar la vinculación correctamente.
                </p>
            </div>

            <!-- Navigation tabs -->
            <div class="container-fluid">
                <ul class="full-box list-unstyled page-nav-tabs">
                    <li>
                        <a href="producto-nuevo.html"><i class="fas fa-plus fa-fw"></i> &nbsp; AGREGAR PRODUCTO</a>
                    </li>
                    <li>
                        <a href="producto-lista.html"><i class="fas fa-clipboard-list fa-fw"></i> &nbsp; LISTA DE PRODUCTOS</a>
                    </li>
                    <li>
                        <a class="active" href="producto-vincular.html"><i class="fas fa-link fa-fw"></i> &nbsp; VINCULAR PRODUCTO</a>
                    </li>
                </ul>
            </div>

            <!-- Formulario de vinculación -->
            <div class="container-fluid">
                <form action="#" method="POST" class="form-neon">
                    <fieldset>
                        <legend><i class="fas fa-box"></i> &nbsp; Información del Producto</legend>
                        <div class="container-fluid">
                            <div class="row">
                                <div class="col-12 col-md-6">
                                    <div class="form-group">
                                        <label for="producto-id" class="bmd-label-floating">ID del Producto</label>
                                        <input type="text" class="form-control" id="producto-id" name="producto-id" required>
                                    </div>
                                </div>
                                <div class="col-12 col-md-6">
                                    <div class="form-group">
                                        <label for="categoria-id" class="bmd-label-floating">ID de la Categoría</label>
                                        <input type="text" class="form-control" id="categoria-id" name="categoria-id" required>
                                    </div>
                                </div>
                                <div class="col-12 col-md-6">
                                    <div class="form-group">
                                        <label for="proveedor-id" class="bmd-label-floating">ID del Proveedor</label>
                                        <input type="text" class="form-control" id="proveedor-id" name="proveedor-id" required>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </fieldset>
                    <p class="text-center">
                        <button type="submit" class="btn btn-info"><i class="fas fa-save"></i> &nbsp; Vincular Producto</button>
                    </p>
                </form>
            </div>
        </section>
    </main>

    <!-- Scripts necesarios -->
    <script src="./js/jquery-3.4.1.min.js"></script>
    <script src="./js/popper.min.js"></script>
    <script src="./js/bootstrap.min.js"></script>
    <script src="./js/jquery.mCustomScrollbar.concat.min.js"></script>
    <script src="./js/bootstrap-material-design.min.js"></script>
    <script>$(document).ready(function() { $('body').bootstrapMaterialDesign(); });</script>
    <script src="./js/main.js"></script>
</body>
</html>

    <script src="./js/jquery-3.4.1.min.js"></script>

    <script src="./js/components.js"></script>
    <script src="./js/main.js"></script>

    <script>
        window.addEventListener('load', function() {
            document.body.classList.add('loaded');
        });
    </script>
</body>
</html>
