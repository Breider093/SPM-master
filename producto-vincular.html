<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <title>Vincular Producto</title>

    <!-- Normalize V8.0.1 -->
    <link rel="stylesheet" href="./css/normalize.css">

    <!-- Bootstrap V4.3 -->
    <link rel="stylesheet" href="./css/bootstrap.min.css">

    <!-- Bootstrap Material Design V4.0 -->
    <link rel="stylesheet" href="./css/bootstrap-material-design.min.css">

    <!-- Font Awesome V5.9.0 -->
    <link rel="stylesheet" href="./css/all.css">

    <!-- jQuery Custom Content Scroller V3.1.5 -->
    <link rel="stylesheet" href="./css/jquery.mCustomScrollbar.css">
    <link rel="stylesheet" href="./css/sweetalert2.min.css">

    <!-- General Styles -->
    <link rel="stylesheet" href="./css/style.css">

    <!-- Preload Styles -->
    <link rel="stylesheet" href="./css/preload.css">
</head>
<body>
    <!-- Main container -->
    <main class="full-box main-container">
        <!-- Page content -->
        <section class="full-box page-content">
            <!-- Page header -->
            <div class="full-box page-header">
                <h3 class="text-left">
                    <i class="fas fa-link fa-fw"></i> &nbsp; VINCULAR PRODUCTO A PROVEEDORES
                </h3>
                <p class="text-justify">
                    Formulario para vincular productos a proveedores.
                </p>
            </div>

            <div class="container-fluid">
                <ul class="full-box list-unstyled page-nav-tabs">
                    <li>
                        <a href="producto-nuevo.html"><i class="fas fa-plus fa-fw"></i> &nbsp; AGREGAR PRODUCTO</a>
                    </li>
                    <li>
                        <a href="producto-lista.html"><i class="fas fa-clipboard-list fa-fw"></i> &nbsp; LISTA DE PRODUCTOS</a>
                    </li>
                    <li>
                        <a class="active" href="producto-vincular.html"><i class="fas fa-link fa-fw"></i> &nbsp; VINCULAR PRODUCTO</a>
                    </li>
                </ul>
            </div>
            
            <!-- Formulario de vinculación -->
            <div class="container-fluid">
                <form action="" class="form-neon" autocomplete="off" id="formVincularProducto">
                    <fieldset>
                        <legend><i class="far fa-plus-square"></i> &nbsp; Formulario de vincular Producto a proveedores</legend>
                        <div class="container-fluid">
                            <div class="row">
                                <div class="col-12 col-md-6">
                                    <div class="form-group">
                                        <label for="producto" class="bmd-label-static">Producto *</label>
                                        <select class="form-control" name="producto" id="producto" required>
                                            <option value="" selected="">Seleccionar *</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="col-12 col-md-6">
                                    <div class="form-group">
                                        <label for="proveedor" class="bmd-label-static">Proveedor *</label>
                                        <select class="form-control" name="proveedor" id="proveedor" required>
                                            <option value="" selected="">Seleccionar *</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="col-12 col-md-6">
                                    <div class="form-group">
                                        <label for="costo_subarriendo" class="bmd-label-floating">Costo subarriendo</label>
                                        <input type="number" class="form-control" name="costo_subarriendo" id="costo_subarriendo" value="0" min="0" step="0.01">
                                    </div>
                                </div>
                                <div class="col-12 col-md-6">
                                    <div class="form-group">
                                        <label for="vinculo_habilitado" class="bmd-label-static">Habilitado</label>
                                        <div class="custom-control custom-checkbox" style="padding-top: 10px;">
                                            <input type="checkbox" class="custom-control-input" id="vinculo_habilitado" name="vinculo_habilitado" checked>
                                            <label class="custom-control-label" for="vinculo_habilitado"></label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </fieldset>
                    <p class="text-center" style="margin-top: 40px;">
                        <button type="submit" class="btn btn-success" style="margin-right: 10px;">Vincular Producto</button>
                        <button type="reset" class="btn btn-danger">Cancelar</button>
                    </p>
                </form>
            </div>
        </section>
    </main>

    <!-- Scripts necesarios -->
    <script src="./js/jquery-3.4.1.min.js"></script>
    <script src="./js/popper.min.js"></script>
    <script src="./js/bootstrap.min.js"></script>
    <script src="./js/jquery.mCustomScrollbar.concat.min.js"></script>
    <script src="./js/bootstrap-material-design.min.js"></script>
    <script src="./js/sweetalert2.min.js"></script>
    <script src="./js/productos/producto-vincular.js"></script>
    <script src="./js/components.js"></script>
    <script src="./js/main.js"></script>
</body>
</html>
