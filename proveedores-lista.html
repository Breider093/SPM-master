<body>
    <main class="full-box main-container">
        <section class="full-box page-content">
            <div class="full-box page-header">
                <h3><i class="fas fa-truck fa-fw"></i> &nbsp; PROVEEDORES</h3>
                <p>Consulta y administra los proveedores registrados.</p>
            </div>
            <div class="container-fluid">
                <ul class="full-box list-unstyled page-nav-tabs">
                    <li><a href="proveedores-nuevo.html"><i class="fas fa-plus fa-fw"></i> &nbsp; NUEVO PROVEEDOR</a></li>

                </ul>

            <div class="container-fluid">

                </div>
                <div class="proveedores-grid-wrapper">
