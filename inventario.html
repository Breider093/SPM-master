<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario</title>

    <!-- Normalize V8.0.1 -->
    <link rel="stylesheet" href="./css/normalize.css">

    <!-- Bootstrap V4.3 -->
    <link rel="stylesheet" href="./css/bootstrap.min.css">

    <!-- Bootstrap Material Design V4.0 -->
    <link rel="stylesheet" href="./css/bootstrap-material-design.min.css">

    <!-- Font Awesome V5.9.0 -->
    <link rel="stylesheet" href="./css/all.css">

    <!-- Sweet Alerts V8.13.0 CSS file -->
    <link rel="stylesheet" href="./css/sweetalert2.min.css">

    <!-- jQuery Custom Content Scroller V3.1.5 -->
    <link rel="stylesheet" href="./css/jquery.mCustomScrollbar.css">
    
    <!-- General Styles -->
    <link rel="stylesheet" href="./css/style.css">

    <!-- Preload Styles -->
    <link rel="stylesheet" href="./css/preload.css">
</head>
<body class="scroll-style-1">
    <!-- Loading -->
    <div class="loading">
        <div class="spinner-border text-primary" role="status">
            <span class="sr-only">Loading...</span>
        </div>
    </div>
    <!-- Main container -->
    <main class="full-box main-container">
        <!-- El menú lateral se cargará dinámicamente desde components.js -->

        <!-- Page content -->
        <section class="full-box page-content">
            <!-- La barra de navegación se cargará dinámicamente desde components.js -->

            <!-- Page header -->
            <div class="full-box page-header">
                <h3 class="text-left">
                    <i class="fas fa-boxes fa-fw"></i> &nbsp; INVENTARIO
                </h3>
                <p class="text-justify">
                    Consulta el inventario de productos disponibles, incluyendo su saldo en bodega, remisiones, devoluciones y reposiciones.
                </p>
            </div>

            <div class="container-fluid">
                <ul class="full-box list-unstyled page-nav-tabs">
                    <li>
                        <a class="active" href="inventario.html"><i class="fas fa-boxes fa-fw"></i> &nbsp; INVENTARIO</a>
                    </li>
                    <li>
                        <a href="equipos-obra.html"><i class="fas fa-hard-hat fa-fw"></i> &nbsp; EQUIPOS EN OBRA</a>
                    </li>
                </ul>
            </div>

            <!-- Content -->
            <div class="container-fluid">
                <div class="row mb-4">
                    <div class="col-12 col-md-4">
                        <div class="form-group bmd-form-group">
                            <label for="proveedor" class="bmd-label-floating">Proveedor</label>
                            <select class="form-control" id="proveedor">
                                <option value="">Seleccione un proveedor</option>
                                <option value="todos">TODOS</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-12 col-md-4">
                        <div class="form-group bmd-form-group">
                            <label for="tipoProducto" class="bmd-label-floating">Tipo Producto</label>
                            <select class="form-control" id="tipoProducto">
                                <option value="">Seleccione un tipo</option>
                                <option value="todos">TODOS</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-12 col-md-4">
                        <div class="form-group bmd-form-group">
                            <label for="descripcion" class="bmd-label-floating">Descripción</label>
                            <input type="text" class="form-control" id="descripcion" maxlength="70">
                        </div>
                    </div>
                </div>
                <div class="row mb-4">
                    <div class="col-12 text-right">
                        <button id="inventarioBuscar" type="button" class="btn btn-raised btn-info"><i class="fas fa-search fa-fw"></i> &nbsp; BUSCAR</button>
                        <button id="btnExportarPdfInventario" type="button" class="btn btn-raised btn-success"><i class="fas fa-file-pdf fa-fw"></i> &nbsp; EXPORTAR PDF</button>
                        <button id="btnExportarExcelInventario" type="button" class="btn btn-raised btn-success"><i class="fas fa-file-excel fa-fw"></i> &nbsp; EXPORTAR EXCEL</button>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-dark table-sm">
                        <thead>
                            <tr class="text-center roboto-medium">
                                <th>CÓDIGO</th>
                                <th>DESCRIPCIÓN</th>
                                <th>TIPO</th>
                                <th>SALDO PROVEEDOR</th>
                                <th>REMISIÓN</th>
                                <th>DEVOLUCIÓN</th>
                                <th>REPOSICIÓN</th>
                                <th>EN ALQUILER</th>
                                <th>EN BODEGA</th>
                                <th>ESTADO</th>
                            </tr>
                        </thead>
                        <tbody id="inventarioTableBody"></tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <!-- Scripts necesarios -->
    <script src="./js/jquery-3.4.1.min.js"></script>
    <script src="./js/popper.min.js"></script>
    <script src="./js/bootstrap.min.js"></script>
    <script src="./js/jquery.mCustomScrollbar.concat.min.js"></script>
    <script src="./js/bootstrap-material-design.min.js"></script>
    <script>$(document).ready(function() { $('body').bootstrapMaterialDesign(); });</script>

    <!-- Componentes -->
    <script src="./js/components.js"></script>

    <script src="./js/main.js"></script>

    <!-- Script para manejar la precarga -->
    <script src="./js/api/reportes/reportes-api.js"></script>
    <script>
        window.addEventListener('load', function() {
            document.body.classList.add('loaded');
        });
    </script>
</body>
</html>
