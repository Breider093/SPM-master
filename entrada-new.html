<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Entrada</title>

    <!-- Normalize V8.0.1 -->
    <link rel="stylesheet" href="./css/normalize.css">

    <!-- Bootstrap V4.3 -->
    <link rel="stylesheet" href="./css/bootstrap.min.css">

    <!-- Bootstrap Material Design V4.0 -->
    <link rel="stylesheet" href="./css/bootstrap-material-design.min.css">

    <!-- Font Awesome V5.9.0 -->
    <link rel="stylesheet" href="./css/all.css">

    <!-- Sweet Alerts V8.13.0 CSS file -->
    <link rel="stylesheet" href="./css/sweetalert2.min.css">

    <!-- jQuery Custom Content Scroller V3.1.5 -->
    <link rel="stylesheet" href="./css/jquery.mCustomScrollbar.css">
    
    <!-- General Styles -->
    <link rel="stylesheet" href="./css/style.css">

    <!-- Preload Styles -->
    <link rel="stylesheet" href="./css/preload.css">

    <style>
        .form-card {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            padding: 20px;
            margin-bottom: 20px;
        }
        .form-input {
            border-radius: 25px;
            padding: 10px 20px;
            border: 1px solid #e0e0e0;
            transition: all 0.3s ease;
        }
        .form-input:focus {
            border-color: #2C3E50;
            box-shadow: 0 0 0 0.2rem rgba(44, 62, 80, 0.25);
        }
        .btn-custom {
            border-radius: 25px;
            padding: 10px 30px;
            font-weight: 500;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }
        .btn-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .product-item {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }
        .product-item:hover {
            background: #e9ecef;
        }
        .remove-product {
            color: #E74C3C;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .remove-product:hover {
            transform: scale(1.2);
        }
    </style>
</head>
<body>
    <!-- Main container -->
    <main class="full-box main-container">
        <!-- Page content -->
        <section class="full-box page-content">
            <!-- Page header -->
            <div class="full-box page-header">
                <h3 class="text-left">
                    <i class="fas fa-box fa-fw"></i> &nbsp; NUEVA ENTRADA
                </h3>
                <p class="text-justify">
                    En esta sección puedes registrar nuevas entradas de productos al inventario.
                </p>
            </div>

            <!-- Navigation tabs -->
            <div class="container-fluid">
                <ul class="full-box list-unstyled page-nav-tabs">
                    <li>
                        <a class="active" href="entrada-new.html"><i class="fas fa-plus fa-fw"></i> &nbsp; NUEVA ENTRADA</a>
                    </li>
                    <li>
                        <a href="entrada-list.html"><i class="fas fa-clipboard-list fa-fw"></i> &nbsp; LISTA DE ENTRADAS</a>
                    </li>
                </ul>
            </div>

            <!-- Content -->
            <div class="container-fluid">
                <form class="form-neon" id="entradaForm">
                    <!-- Información General -->
                    <div class="form-card">
                        <h4 class="mb-4">Información General</h4>
                        <div class="row">
                            <div class="col-12 col-md-4">
                                <div class="form-group">
                                    <label for="fecha">
                                        <i class="fas fa-calendar"></i> Fecha de Entrada
                                    </label>
                                    <input type="date" class="form-control form-input" id="fecha" name="fecha" required>
                                </div>
                            </div>
                            <div class="col-12 col-md-4">
                                <div class="form-group">
                                    <label for="proveedor">
                                        <i class="fas fa-truck"></i> Proveedor
                                    </label>
                                    <select class="form-control form-input" id="proveedor" name="proveedor" required>
                                        <option value="">Seleccione un proveedor</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-12 col-md-4">
                                <div class="form-group">
                                    <label for="factura">
                                        <i class="fas fa-file-invoice"></i> Número de Factura
                                    </label>
                                    <input type="text" class="form-control form-input" id="factura" name="factura" required>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Productos -->
                    <div class="form-card">
                        <h4 class="mb-4">Productos</h4>
                        <div id="productosContainer">
                            <!-- Producto 1 -->
                            <div class="product-item">
                                <div class="row">
                                    <div class="col-12 col-md-4">
                                        <div class="form-group">
                                            <label for="producto1">
                                                <i class="fas fa-box"></i> Producto
                                            </label>
                                            <select class="form-control form-input" id="producto1" name="productos[]" required>
                                                <option value="">Seleccione un producto</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="col-12 col-md-2">
                                        <div class="form-group">
                                            <label for="cantidad1">
                                                <i class="fas fa-cubes"></i> Cantidad
                                            </label>
                                            <input type="number" class="form-control form-input" id="cantidad1" name="cantidades[]" min="1" required>
                                        </div>
                                    </div>
                                    <div class="col-12 col-md-3">
                                        <div class="form-group">
                                            <label for="precio1">
                                                <i class="fas fa-dollar-sign"></i> Precio Unitario
                                            </label>
                                            <input type="number" class="form-control form-input" id="precio1" name="precios[]" min="0.01" step="0.01" required>
                                        </div>
                                    </div>
                                    <div class="col-12 col-md-2">
                                        <div class="form-group">
                                            <label for="lote1">
                                                <i class="fas fa-barcode"></i> Lote
                                            </label>
                                            <input type="text" class="form-control form-input" id="lote1" name="lotes[]" required>
                                        </div>
                                    </div>
                                    <div class="col-12 col-md-1">
                                        <div class="form-group">
                                            <label>&nbsp;</label>
                                            <button type="button" class="btn btn-danger btn-block remove-product" onclick="removeProduct(this)">
                                                <i class="fas fa-times"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="text-right mt-3">
                            <button type="button" class="btn btn-info btn-custom" onclick="addProduct()">
                                <i class="fas fa-plus"></i> &nbsp; AGREGAR PRODUCTO
                            </button>
                        </div>
                    </div>

                    <!-- Observaciones -->
                    <div class="form-card">
                        <h4 class="mb-4">Observaciones</h4>
                        <div class="form-group">
                            <textarea class="form-control form-input" id="observaciones" name="observaciones" rows="3" placeholder="Ingrese cualquier observación adicional sobre la entrada"></textarea>
                        </div>
                    </div>

                    <!-- Botones de Acción -->
                    <div class="text-center mt-4">
                        <button type="submit" class="btn btn-primary btn-custom">
                            <i class="fas fa-save"></i> &nbsp; GUARDAR ENTRADA
                        </button>
                        <button type="reset" class="btn btn-secondary btn-custom ml-2">
                            <i class="fas fa-eraser"></i> &nbsp; LIMPIAR
                        </button>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <!-- Scripts necesarios -->
    <script src="./js/jquery-3.4.1.min.js"></script>
    <script src="./js/popper.min.js"></script>
    <script src="./js/bootstrap.min.js"></script>
    <script src="./js/jquery.mCustomScrollbar.concat.min.js"></script>
    <script src="./js/bootstrap-material-design.min.js"></script>
    <script src="./js/sweetalert2.min.js"></script>
    <script>
        $(document).ready(function() {
            $('body').bootstrapMaterialDesign();

            // Manejo del formulario
            $('#entradaForm').on('submit', function(e) {
                e.preventDefault();
                Swal.fire({
                    title: '¿Guardar entrada?',
                    text: "¿Está seguro de guardar esta entrada de productos?",
                    icon: 'question',
                    showCancelButton: true,
                    confirmButtonColor: '#3085d6',
                    cancelButtonColor: '#d33',
                    confirmButtonText: 'Sí, guardar',
                    cancelButtonText: 'Cancelar'
                }).then((result) => {
                    if (result.isConfirmed) {
                        Swal.fire(
                            '¡Guardado!',
                            'La entrada ha sido registrada correctamente.',
                            'success'
                        ).then(() => {
                            window.location.href = 'entrada-list.html';
                        });
                    }
                });
            });

            // Confirmación para limpiar formulario
            $('button[type="reset"]').click(function(e) {
                e.preventDefault();
                Swal.fire({
                    title: '¿Limpiar formulario?',
                    text: "Se perderán todos los datos ingresados",
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#3085d6',
                    cancelButtonColor: '#d33',
                    confirmButtonText: 'Sí, limpiar',
                    cancelButtonText: 'Cancelar'
                }).then((result) => {
                    if (result.isConfirmed) {
                        $('#entradaForm')[0].reset();
                    }
                });
            });
        });

        // Función para agregar nuevo producto
        function addProduct() {
            const container = document.getElementById('productosContainer');
            const productCount = container.children.length + 1;
            
            const newProduct = document.createElement('div');
            newProduct.className = 'product-item';
            newProduct.innerHTML = `
                <div class="row">
                    <div class="col-12 col-md-4">
                        <div class="form-group">
                            <label for="producto${productCount}">
                                <i class="fas fa-box"></i> Producto
                            </label>
                            <select class="form-control form-input" id="producto${productCount}" name="productos[]" required>
                                <option value="">Seleccione un producto</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-12 col-md-2">
                        <div class="form-group">
                            <label for="cantidad${productCount}">
                                <i class="fas fa-cubes"></i> Cantidad
                            </label>
                            <input type="number" class="form-control form-input" id="cantidad${productCount}" name="cantidades[]" min="1" required>
                        </div>
                    </div>
                    <div class="col-12 col-md-3">
                        <div class="form-group">
                            <label for="precio${productCount}">
                                <i class="fas fa-dollar-sign"></i> Precio Unitario
                            </label>
                            <input type="number" class="form-control form-input" id="precio${productCount}" name="precios[]" min="0.01" step="0.01" required>
                        </div>
                    </div>
                    <div class="col-12 col-md-2">
                        <div class="form-group">
                            <label for="lote${productCount}">
                                <i class="fas fa-barcode"></i> Lote
                            </label>
                            <input type="text" class="form-control form-input" id="lote${productCount}" name="lotes[]" required>
                        </div>
                    </div>
                    <div class="col-12 col-md-1">
                        <div class="form-group">
                            <label>&nbsp;</label>
                            <button type="button" class="btn btn-danger btn-block remove-product" onclick="removeProduct(this)">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;
            
            container.appendChild(newProduct);
        }

        // Función para eliminar producto
        function removeProduct(button) {
            const productItem = button.closest('.product-item');
            if (document.querySelectorAll('.product-item').length > 1) {
                Swal.fire({
                    title: '¿Eliminar producto?',
                    text: "¿Está seguro de eliminar este producto de la entrada?",
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#3085d6',
                    cancelButtonColor: '#d33',
                    confirmButtonText: 'Sí, eliminar',
                    cancelButtonText: 'Cancelar'
                }).then((result) => {
                    if (result.isConfirmed) {
                        productItem.remove();
                    }
                });
            } else {
                Swal.fire(
                    'Error',
                    'Debe haber al menos un producto en la entrada',
                    'error'
                );
            }
        }
    </script>
    <script src="./js/inventario/entradas-salidas-api.js"></script>
    <script src="./js/inventario/entrada-new.js"></script>
    <script src="./js/components.js"></script>
    <script src="./js/main.js"></script>

    <!-- Script para manejar la precarga -->
    <script>
        window.addEventListener('load', function() {
            document.body.classList.add('loaded');
        });
    </script>
</body>
</html>
