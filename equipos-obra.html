        /* Barra de navegación minimalista estilo clientes */
        .reportes-nav-list {

            align-items: center;
            list-style: none;
            margin: 0 0 2rem 0;
            padding: 0;

        }
        .reportes-nav-link {
            display: flex;

            gap: 0.5rem;
            font-family: 'Roboto', Arial, sans-serif;
            font-size: 1.05rem;
            text-transform: uppercase;
            font-weight: 400;
            color: #34495e;
            letter-spacing: 1px;
            text-decoration: none;
            transition: color 0.2s;
        }
        .reportes-nav-link i {
            font-size: 1.1em;
        }
        .reportes-nav-link.active {
            color: #ec7063 !important; /* Rojo suave */
            font-weight: 500;
        }
        .reportes-nav-link:hover {
            color: #2ecc71 !important;
            border: 2px solid #2ecc71;
            font-weight: bold;
            border-radius: 0 10px 10px 0;
            text-decoration: none;
        }
        .reportes-nav-list li {
            margin: 0;
        }
        /* Fin barra de navegación minimalista */

        .nav-link.active.reporte-tab-equipos,

        .nav-link.reporte-tab-saldo:hover {
