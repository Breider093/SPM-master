<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipos en Obra</title>

    <!-- Normalize V8.0.1 -->
    <link rel="stylesheet" href="./css/normalize.css">

    <!-- Bootstrap V4.3 -->
    <link rel="stylesheet" href="./css/bootstrap.min.css">

    <!-- Bootstrap Material Design V4.0 -->
    <link rel="stylesheet" href="./css/bootstrap-material-design.min.css">

    <!-- Font Awesome V5.9.0 -->
    <link rel="stylesheet" href="./css/all.css">

    <!-- Sweet Alerts V8.13.0 CSS file -->
    <link rel="stylesheet" href="./css/sweetalert2.min.css">

    <!-- jQuery Custom Content Scroller V3.1.5 -->
    <link rel="stylesheet" href="./css/jquery.mCustomScrollbar.css">
    
    <!-- General Styles -->
    <link rel="stylesheet" href="./css/style.css">

    <!-- Preload Styles -->
    <link rel="stylesheet" href="./css/preload.css">
</head>
<body>
    <!-- Main container -->
    <main class="full-box main-container">
        <!-- El menú lateral se cargará dinámicamente desde components.js -->

        <!-- Page content -->
        <section class="full-box page-content">
            <!-- La barra de navegación se cargará dinámicamente desde components.js -->

            <!-- Page header -->
            <div class="full-box page-header">
                <h3 class="text-left">
                    <i class="fas fa-hard-hat fa-fw"></i> &nbsp; EQUIPOS EN OBRA
                </h3>
                <p class="text-justify">
                    Consulta los equipos asignados a diferentes obras, incluyendo su cantidad y cliente asociado.
                </p>
            </div>

            <div class="container-fluid">
                <ul class="full-box list-unstyled page-nav-tabs">
                    <li>
                        <a href="inventario.html"><i class="fas fa-boxes fa-fw"></i> &nbsp; INVENTARIO</a>
                    </li>
                    <li>
                        <a class="active" href="equipos-obra.html"><i class="fas fa-hard-hat fa-fw"></i> &nbsp; EQUIPOS EN OBRA</a>
                    </li>
                </ul>
            </div>

            <!-- Content -->
            <div class="container-fluid">
                <div class="row mb-4">
                    <div class="col-12 col-md-6">
                        <div class="form-group">
                            <label for="descripcion">Descripción</label>
                            <input type="text" class="form-control" id="descripcion" placeholder="Buscar descripción...">
                        </div>
                    </div>
                    <div class="col-12 col-md-6 text-right">
                        <button class="btn btn-success"><i class="fas fa-file-pdf"></i> PDF</button>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Id</th>
                                <th>Descripción</th>
                                <th>Cantidad</th>
                                <th>Cliente</th>
                                <th>Obra</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>RM-136</td>
                                <td>ABRAZADERAS RM</td>
                                <td>1</td>
                                <td>IMPORTADORA JVC</td>
                                <td>CRA 44 88-05</td>
                            </tr>
                            <!-- Más filas según sea necesario -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <!-- Scripts necesarios -->
    <script src="./js/jquery-3.4.1.min.js"></script>
    <script src="./js/popper.min.js"></script>
    <script src="./js/bootstrap.min.js"></script>
    <script src="./js/jquery.mCustomScrollbar.concat.min.js"></script>
    <script src="./js/bootstrap-material-design.min.js"></script>
    <script>$(document).ready(function() { $('body').bootstrapMaterialDesign(); });</script>

    <!-- Componentes -->
    <script src="./js/components.js"></script>

    <script src="./js/main.js"></script>
</body>
</html>
