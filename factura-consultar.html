<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultar Facturas</title>

    <!-- Normalize V8.0.1 -->
    <link rel="stylesheet" href="./css/normalize.css">

    <!-- Bootstrap V4.3 -->
    <link rel="stylesheet" href="./css/bootstrap.min.css">

    <!-- Bootstrap Material Design V4.0 -->
    <link rel="stylesheet" href="./css/bootstrap-material-design.min.css">

    <!-- Font Awesome V5.9.0 -->
    <link rel="stylesheet" href="./css/all.css">

    <!-- Sweet Alerts V8.13.0 CSS file -->
    <link rel="stylesheet" href="./css/sweetalert2.min.css">

    <!-- jQuery Custom Content Scroller V3.1.5 -->
    <link rel="stylesheet" href="./css/jquery.mCustomScrollbar.css">
    
    <!-- General Styles -->
    <link rel="stylesheet" href="./css/style.css">

    <!-- Preload Styles -->
    <link rel="stylesheet" href="./css/preload.css">

    <style>
        .factura-card {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            padding: 20px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }
        .factura-card:hover {
            transform: translateY(-5px);
        }
        .factura-card.pagada {
            border-left: 5px solid #28a745;
        }
        .factura-card.pendiente {
            border-left: 5px solid #ffc107;
        }
        .factura-card.vencida {
            border-left: 5px solid #dc3545;
        }
        .factura-icon {
            font-size: 2rem;
            margin-right: 15px;
        }
        .factura-title {
            font-weight: 600;
            margin-bottom: 5px;
        }
        .factura-date {
            color: #6c757d;
            font-size: 0.9rem;
        }
        .factura-actions {
            display: flex;
            gap: 10px;
        }
        .action-btn {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .filter-section {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            padding: 20px;
            margin-bottom: 20px;
        }
        .form-input {
            border-radius: 25px;
            padding: 10px 20px;
            border: 1px solid #e0e0e0;
            transition: all 0.3s ease;
        }
        .form-input:focus {
            border-color: #2C3E50;
            box-shadow: 0 0 0 0.2rem rgba(44, 62, 80, 0.25);
        }
        .btn-custom {
            border-radius: 25px;
            padding: 10px 30px;
            font-weight: 500;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }
        .btn-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .product-list {
            margin-top: 10px;
            padding-left: 20px;
        }
        .product-list li {
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <!-- Main container -->
    <main class="full-box main-container">
        <!-- Page content -->
        <section class="full-box page-content">
            <!-- Page header -->
            <div class="full-box page-header">
                <h3 class="text-left">
                    <i class="fas fa-search fa-fw"></i> &nbsp; CONSULTAR FACTURAS
                </h3>
                <p class="text-justify">
                    En esta sección puedes consultar y gestionar las facturas registradas. Filtra por diferentes criterios para encontrar la información que necesitas.
                </p>
            </div>

            <!-- Navigation tabs -->
            <div class="container-fluid">
                <ul class="full-box list-unstyled page-nav-tabs">
                    <li>
                        <a href="factura-crear.html"><i class="fas fa-plus fa-fw"></i> &nbsp; NUEVA FACTURA</a>
                    </li>
                    <li>
                        <a class="active" href="factura-consultar.html"><i class="fas fa-search fa-fw"></i> &nbsp; CONSULTAR FACTURAS</a>
                    </li>
                    <li>
                        <a href="factura-pendientes.html"><i class="fas fa-clock fa-fw"></i> &nbsp; FACTURAS PENDIENTES</a>
                    </li>
                </ul>
            </div>

            <!-- Content -->
            <div class="container-fluid">
                <!-- Filtros -->
                <div class="filter-section">
                    <form class="form-neon" id="filterForm">
                        <div class="row">
                            <div class="col-12 col-md-3">
                                <div class="form-group">
                                    <label for="busqueda">
                                        <i class="fas fa-search"></i> Búsqueda
                                    </label>
                                    <input type="text" class="form-control form-input" id="busqueda" name="busqueda" placeholder="Número de factura o cliente">
                                </div>
                            </div>
                            <div class="col-12 col-md-3">
                                <div class="form-group">
                                    <label for="estadoFactura">
                                        <i class="fas fa-filter"></i> Estado
                                    </label>
                                    <select class="form-control form-input" id="estadoFactura" name="estadoFactura">
                                        <option value="">Todos los estados</option>
                                        <option value="pagada">Pagada</option>
                                        <option value="pendiente">Pendiente</option>
                                        <option value="vencida">Vencida</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-12 col-md-3">
                                <div class="form-group">
                                    <label for="fechaInicio">
                                        <i class="fas fa-calendar"></i> Fecha Inicio
                                    </label>
                                    <input type="date" class="form-control form-input" id="fechaInicio" name="fechaInicio">
                                </div>
                            </div>
                            <div class="col-12 col-md-3">
                                <div class="form-group">
                                    <label for="fechaFin">
                                        <i class="fas fa-calendar"></i> Fecha Fin
                                    </label>
                                    <input type="date" class="form-control form-input" id="fechaFin" name="fechaFin">
                                </div>
                            </div>
                            <div class="col-12 col-md-3">
                                <div class="form-group">
                                    <label for="cliente">
                                        <i class="fas fa-user"></i> Cliente
                                    </label>
                                    <select class="form-control form-input" id="cliente" name="cliente">
                                        <option value="">Todos los clientes</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="text-center mt-3">
                            <button type="submit" class="btn btn-info btn-custom">
                                <i class="fas fa-search"></i> &nbsp; FILTRAR
                            </button>
                            <button type="reset" class="btn btn-secondary btn-custom ml-2">
                                <i class="fas fa-eraser"></i> &nbsp; LIMPIAR
                            </button>
                        </div>
                    </form>
                </div>

                <div id="facturasContainer"></div>
            </div>
        </section>
    </main>

    <!-- Scripts necesarios -->
    <script src="./js/jquery-3.4.1.min.js"></script>
    <script src="./js/popper.min.js"></script>
    <script src="./js/bootstrap.min.js"></script>
    <script src="./js/jquery.mCustomScrollbar.concat.min.js"></script>
    <script src="./js/bootstrap-material-design.min.js"></script>
    <script src="./js/sweetalert2.min.js"></script>
    <script src="./js/facturas/facturas-api.js"></script>
    <script src="./js/remisiones/facturas.js"></script>
    <script>
        if (false) {
        $(document).ready(function() {
            $('body').bootstrapMaterialDesign();

            // Manejo del formulario de filtros
            $('#filterForm').on('submit', function(e) {
                e.preventDefault();
                const busqueda = $('#busqueda').val().toLowerCase();
                const estado = $('#estadoFactura').val();
                const fechaInicio = $('#fechaInicio').val();
                const fechaFin = $('#fechaFin').val();
                const cliente = $('#cliente').val();

                cargarFacturas({ busqueda, estado, fecha_desde: fechaInicio, fecha_hasta: fechaFin, cliente });
            });

            // Confirmación para limpiar filtros
            $('button[type="reset"]').click(function(e) {
                e.preventDefault();
                Swal.fire({
                    title: '¿Limpiar filtros?',
                    text: "Se mostrarán todas las facturas",
                    icon: 'question',
                    showCancelButton: true,
                    confirmButtonColor: '#3085d6',
                    cancelButtonColor: '#d33',
                    confirmButtonText: 'Sí, limpiar',
                    cancelButtonText: 'Cancelar'
                }).then((result) => {
                    if (result.isConfirmed) {
                        $('#filterForm')[0].reset();
                    }
                });
            });

        });
        }
    </script>
    <script src="./js/facturas/facturas-api.js"></script>
    <script src="./js/components.js"></script>
    <script src="./js/main.js"></script>

    <!-- Script para manejar la precarga -->
    <script>
        window.addEventListener('load', function() {
            document.body.classList.add('loaded');
        });
    </script>
</body>
</html>
